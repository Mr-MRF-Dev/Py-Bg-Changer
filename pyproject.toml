[project]
name = "py-bg-changer"
version = "0.1.0"
description = "A simple cross-platform wallpaper changer made with Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.scripts]
py-bg-changer = "py_bg_changer.cli:main"
pbc = "py_bg_changer.cli:main"

# Same commands without a console window (use these from Win+R).
[project.gui-scripts]
py-bg-changer-w = "py_bg_changer.gui:main"
pbcw = "py_bg_changer.gui:main"

[dependency-groups]
dev = ["pytest>=9.0.3"]

[build-system]
requires = ["uv_build>=0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
