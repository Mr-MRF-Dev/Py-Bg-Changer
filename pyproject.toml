[project]
name = "py-bg-changer"
version = "1.2.1"
description = "A simple cross-platform wallpaper changer made with Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mr MRF Dev" }]
keywords = ["wallpaper", "background", "desktop", "cli", "cross-platform"]
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/Mr-MRF-Dev/Py-Bg-Changer"
Issues = "https://github.com/Mr-MRF-Dev/Py-Bg-Changer/issues"

[project.scripts]
py-bg-changer = "py_bg_changer.cli:main"
pbc = "py_bg_changer.cli:main"

# Same commands without a console window.
[project.gui-scripts]
py-bg-changer-w = "py_bg_changer.gui:main"
pbcw = "py_bg_changer.gui:main"

[dependency-groups]
dev = ["black", "mypy", "pytest", "ruff"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]                   # black takes care of the line length

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
