[project]
name = "py-bg-changer"
version = "0.1.0"
description = "Change your desktop wallpaper from the terminal, Win+R or a launcher. Windows, macOS and Linux."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.scripts]
py-bg-changer = "py_bg_changer.cli:main"
pbc = "py_bg_changer.cli:main"

# Same commands without a console window (use these from Win+R).
[project.gui-scripts]
py-bg-changer-w = "py_bg_changer.gui:main"
pbcw = "py_bg_changer.gui:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
