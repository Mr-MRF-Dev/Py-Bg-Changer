[project]
name = "py-bg-changer"
version = "0.1.0"
description = "A simple cross-platform wallpaper changer made with Python."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.scripts]
py-bg-changer = "py_bg_changer.cli:main"
pbc = "py_bg_changer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
