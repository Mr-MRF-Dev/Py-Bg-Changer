name: release

on:
  push:
    branches: [master]
  workflow_dispatch: # manual re-run on master, e.g. after a failed release

# Never run two releases at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version 🔎
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
      - name: Release only if the tag for this version does not exist yet
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in pyproject.toml: $version"

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null
          status=$?
          set -e

          case $status in
            0)
              echo "Tag v$version already exists, nothing to release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "Tag v$version does not exist yet, releasing."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not check the tags (git exited with $status)"
              exit 1
              ;;
          esac

  publish:
    name: Publish to PyPI 🐍
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for Trusted Publishing (no token to manage)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv build
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

  release:
    name: Release 📚
    needs: [check, publish]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Create Release ⭐
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
