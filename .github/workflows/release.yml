name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    name: Run tests 🧪
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to PyPI 🐍
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed for Trusted Publishing (no token to manage)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv build
      - run: uv publish --trusted-publishing always

  release:
    name: Release 📚
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Create Release ⭐
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
